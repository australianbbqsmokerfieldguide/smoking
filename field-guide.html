<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Low &amp; Slow — A BBQ Field Guide</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121316">
<meta name="background-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Low & Slow">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Zilla+Slab:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --char:        #121316;
    --char-2:      #191b1f;
    --panel:       #1e2126;
    --card:        #24272d;
    --kraft:       #8a97a3;
    --kraft-dim:   #5f6b76;
    --bone:        #eef1f3;
    --smoke:       #9aa5ad;
    --ember:       #9c2b3c;
    --ember-bright:#d94459;
    --amber:       #3d6a86;
    --grey-zone:   #3c4249;
    --dark-zone:   #23262b;
    --line:        #2c3036;
    --radius-s: 6px;
    --radius-m: 12px;
    --radius-l: 20px;
  }

  *{ box-sizing:border-box; }

  button, select, [role="tab"]{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(217,68,89,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(61,106,134,0.06), transparent 55%),
      var(--char);
    color:var(--bone);
    font-family:'Zilla Slab', serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3, .eyebrow, .select-label, .qs-label{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  a{ color:inherit; }

  /* ---------- Masthead ---------- */
  .masthead{
    padding:56px 24px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 14px);
  }
  .masthead .eyebrow{
    display:inline-block;
    font-size:12px;
    color:var(--ember-bright);
    font-weight:600;
    margin-bottom:14px;
  }
  .masthead .eyebrow::before, .masthead .eyebrow::after{
    content:"—";
    color:var(--kraft-dim);
    margin:0 10px;
  }

  /* ---------- Smoker icon ---------- */
  .smoker-icon{
    width:180px;
    height:auto;
    margin:0 auto 10px;
    display:block;
  }
  .masthead h1{
    font-size:clamp(40px, 7vw, 76px);
    margin:0;
    font-weight:700;
    color:var(--bone);
    line-height:0.95;
  }
  .masthead h1 span{ color:var(--ember-bright); }
  .masthead .sub{
    max-width:600px;
    margin:16px auto 0;
    color:var(--smoke);
    font-size:16px;
    font-style:italic;
  }
  .masthead .tagline{
    display:inline-block;
    margin:18px auto 0;
    padding:8px 18px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel);
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-size:12px;
    font-weight:600;
    color:var(--ember-bright);
  }

  .unit-toggle{
    display:inline-flex;
    margin:0 auto 14px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px;
    background:var(--panel);
    gap:1px;
  }
  .unit-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.03em;
    padding:8px 18px;
    min-height:32px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:999px;
    border:none;
    background:transparent;
    color:var(--smoke);
    cursor:pointer;
    transition:background .12s ease, color .12s ease, transform .12s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .unit-btn:hover:not(.active){ color:var(--bone); }
  }
  .unit-btn:active:not(.active){ background:var(--card); transform:scale(0.96); }
  .unit-btn.active{
    background:var(--ember-bright);
    color:var(--char);
  }

  /* ---------- Menu: two dropdown selectors ---------- */
  .menu-bar{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
    max-width:640px;
    margin:0 auto;
    padding:36px 20px 32px;
  }
  .select-wrap{
    flex:1 1 240px;
    min-width:220px;
    max-width:300px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .select-label{
    font-family:'Roboto', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:11px;
    font-weight:600;
    color:var(--kraft-dim);
    padding-left:2px;
  }
  .select-control{ position:relative; }
  .select-control::after{
    content:"";
    position:absolute;
    right:20px; top:50%;
    width:10px; height:10px;
    border-right:2.5px solid var(--ember-bright);
    border-bottom:2.5px solid var(--ember-bright);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .styled-select{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    min-height:56px;
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:var(--radius-s);
    padding:16px 46px 16px 20px;
    font-family:'Roboto', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--bone);
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease, transform .12s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .styled-select:hover{ border-color:var(--kraft-dim); }
  }
  .styled-select:active{ background:var(--panel); }
  .styled-select:focus{ outline:none; border-color:var(--ember-bright); }
  .styled-select:focus-visible{ outline:2px solid var(--ember-bright); outline-offset:2px; }
  .styled-select option{ background:var(--panel); color:var(--bone); font-family:'Roboto', sans-serif; font-size:16px; padding:12px; }

  /* ---------- Main / Panels ---------- */
  main{ max-width:1000px; margin:0 auto; padding:8px 20px 80px; }
  .panel{ display:none; animation:fade .25s ease; }
  .panel.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .hero{
    display:grid;
    grid-template-columns:240px 1fr;
    gap:36px;
    align-items:center;
    padding:36px 0 28px;
    border-bottom:1px dashed var(--line);
  }
  .hero-info .eyebrow{ font-size:12px; color:var(--kraft-dim); font-weight:600; }
  .hero-info h2{ font-size:40px; margin:6px 0 10px; color:var(--bone); }
  .cut-heading{ display:flex; align-items:center; gap:18px; margin:6px 0 10px; }
  .cut-heading h2{ margin:0; }
  .cut-heading-img{ width:150px; height:auto; border-radius:8px; flex:0 0 auto; }
  @media (max-width:560px){
    .cut-heading{ gap:10px; }
    .cut-heading-img{ width:112px; }
    .cut-heading h2{ font-size:34px; }
  }
  .cut-desc{ color:var(--smoke); line-height:1.55; margin:0 0 20px; max-width:52ch; }

  .quickstats{ display:flex; flex-wrap:wrap; gap:26px; }
  .qs-label{ display:block; font-size:11px; color:var(--kraft-dim); margin-bottom:4px; }
  .qs-val{ font-family:'JetBrains Mono', monospace; font-size:15px; color:var(--bone); }
  .qs-val .f{ color:var(--smoke); font-size:12px; }
  .qs-sub{ display:block; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--smoke); margin-top:2px; }

  /* ---------- Dial ---------- */
  .dial-col{ width:240px; margin:0 auto; }
  .dial-wrap{
    width:240px; height:240px;
    position:relative;
    margin:0 auto;
  }
  .dial-ring{
    width:100%; height:100%;
    border-radius:50%;
    position:relative;
  }
  .dial-face{
    position:absolute;
    inset:17px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #262a30, #121316 80%);
    box-shadow: inset 0 0 0 1px rgba(238,241,243,0.06), inset 0 4px 14px rgba(0,0,0,0.55);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:1;
  }
  .dial-readout-c{ font-family:'JetBrains Mono', monospace; font-size:23px; font-weight:700; color:var(--ember-bright); line-height:1; }
  .dial-readout-f{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--smoke); margin-top:4px; }
  .dial-caption{ font-family:'Oswald', sans-serif; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ember-bright); margin-top:6px; opacity:.85; }

  .dial-divider{ width:34px; height:1px; background:var(--line); margin:10px 0; }

  .dial-readout-c.secondary{ font-size:17px; color:var(--kraft); }
  .dial-caption.secondary{ color:var(--kraft); }

  .needle{
    position:absolute;
    left:50%; top:50%;
    transform-origin:50% 100%;
    border-radius:2px;
    z-index:2;
  }
  .needle-target{
    width:3px; height:80px;
    background:linear-gradient(180deg, var(--ember-bright), var(--ember));
    margin-left:-1.5px; margin-top:-80px;
    box-shadow:0 0 6px rgba(217,68,89,0.6);
  }
  .needle-chamber{
    width:2px; height:58px;
    background:linear-gradient(180deg, var(--kraft), var(--kraft-dim));
    margin-left:-1px; margin-top:-58px;
    opacity:.9;
  }
  .dial-pivot{
    position:absolute; left:50%; top:50%;
    width:12px; height:12px;
    background:var(--bone);
    border:2px solid var(--char);
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:3;
  }

  .dial-legend{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--smoke);
  }
  .dial-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dial-legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dial-legend i.target{ background:var(--ember-bright); }
  .dial-legend i.chamber{ background:var(--kraft); }

  .dial-scale-label{
    position:absolute;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--kraft-dim);
  }
  .dial-scale-label.min{ left:4%; bottom:0%; }
  .dial-scale-label.max{ right:4%; bottom:0%; }

  /* ---------- Details grid ---------- */
  .details-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
    margin-top:28px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:22px 24px;
  }
  .card h3{
    font-size:14px;
    margin:0 0 16px;
    color:var(--ember-bright);
    display:flex; align-items:center; gap:8px;
  }
  .card h3::before{ content:""; width:16px; height:1px; background:var(--ember-bright); display:inline-block; }

  .method-list{ margin:0; padding:0; list-style:none; counter-reset:step; }
  .method-list li{
    counter-increment:step;
    position:relative;
    padding-left:34px;
    margin-bottom:16px;
    color:var(--bone);
    line-height:1.5;
    font-size:15px;
  }
  .method-list li:last-child{ margin-bottom:0; }
  .method-list li::before{
    content:counter(step);
    position:absolute; left:0; top:0;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--kraft-dim);
    color:var(--kraft);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
  }

  .side-stack{ display:flex; flex-direction:column; gap:20px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; list-style:none; margin:0; padding:0; }
  .chips li{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    color:var(--kraft);
  }

  .tips-list{ margin:0; padding:0; list-style:none; }
  .tips-list li{
    position:relative;
    padding-left:18px;
    margin-bottom:12px;
    font-size:14px;
    line-height:1.5;
    color:var(--smoke);
  }
  .tips-list li:last-child{ margin-bottom:0; }
  .tips-list li::before{
    content:"";
    position:absolute; left:0; top:8px;
    width:6px; height:6px;
    background:var(--ember-bright);
    border-radius:50%;
  }

  .rub-card{ margin-top:28px; }
  .rub-note{ color:var(--smoke); font-size:14px; line-height:1.5; margin:0 0 18px; max-width:70ch; }
  .rub-list{
    list-style:none; margin:0; padding:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 32px;
  }
  .rub-list li{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    border-bottom:1px dashed var(--line);
    padding-bottom:8px;
    font-size:14px;
    color:var(--bone);
  }
  .rub-amt{ font-family:'JetBrains Mono', monospace; color:var(--ember-bright); font-weight:600; white-space:nowrap; }

  /* ---------- Sides panel ---------- */
  .sides-intro{ padding:36px 0 8px; text-align:center; }
  .sides-intro .eyebrow{ font-size:12px; color:var(--kraft-dim); font-weight:600; }
  .sides-intro h2{ font-size:36px; margin:8px 0 10px; color:var(--bone); }
  .sides-intro p{ color:var(--smoke); line-height:1.55; max-width:60ch; margin:0 auto; }

  .sides-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
    margin-top:28px;
  }
  .side-card h3{
    font-size:18px;
    font-family:'Zilla Slab', serif;
    text-transform:none;
    letter-spacing:0;
    color:var(--bone);
    margin:0 0 6px;
    display:block;
  }
  .side-card h3::before{ display:none; }
  .side-card .side-meta{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:12px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ember-bright);
  }
  .side-card .side-meta span{ display:inline-flex; align-items:center; gap:5px; color:var(--kraft); }
  .side-card .side-meta span::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:var(--ember-bright);
    display:inline-block;
  }
  .side-card p{ color:var(--smoke); font-size:14px; line-height:1.55; margin:0; }

  /* ---------- Temp strip ---------- */
  .temp-strip{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
  }
  .temp-cell{
    padding:16px 18px;
    background:var(--panel);
    border-right:1px solid var(--line);
  }
  .temp-cell:last-child{ border-right:none; }
  .temp-cell .tc-label{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--kraft-dim); }
  .temp-cell .tc-c{ display:block; font-family:'JetBrains Mono', monospace; font-size:22px; color:var(--bone); margin-top:6px; }
  .temp-cell .tc-f{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--smoke); }

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--kraft-dim);
    font-size:12px;
  }

  /* ---------- Wood guide panel ---------- */
  .wood-intro{ padding:36px 0 8px; text-align:center; }
  .wood-intro .eyebrow{ font-size:12px; color:var(--kraft-dim); font-weight:600; }
  .wood-intro h2{ font-size:36px; margin:8px 0 10px; color:var(--bone); }
  .wood-intro p{ color:var(--smoke); line-height:1.55; max-width:60ch; margin:0 auto; }
  .wood-guide-card{
    max-width:640px;
    margin:28px auto 0;
    padding:12px;
  }
  .wood-guide-card img{
    display:block;
    width:100%;
    height:auto;
    border-radius:var(--radius-m);
  }

  /* ---------- Product review panel ---------- */
  .product-hero{
    display:grid;
    grid-template-columns:1fr;
    gap:24px;
    max-width:760px;
    margin:0 auto;
    padding:36px 0 8px;
  }
  .product-gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    max-width:520px;
    margin:20px auto 0;
  }
  .product-gallery.single{
    grid-template-columns:1fr;
    max-width:640px;
  }
  .product-gallery img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:var(--radius-s);
    border:1px solid var(--line);
    background:var(--panel);
    cursor:zoom-in;
    transition:opacity .12s ease;
  }
  .product-gallery.single img{
    aspect-ratio:auto;
    height:auto;
  }
  @media (hover:hover) and (pointer:fine){
    .product-gallery img:hover{ opacity:0.85; }
  }

  /* ---------- Image lightbox ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,10,11,0.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:1000;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:var(--radius-m);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox-close{
    position:fixed;
    top:18px;
    right:18px;
    width:44px;
    height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--panel);
    color:var(--bone);
    cursor:pointer;
  }
  .lightbox-close:hover{ color:var(--ember-bright); border-color:var(--ember-bright); }
  .product-head{ text-align:center; }
  .product-head .eyebrow{ font-size:12px; color:var(--kraft-dim); font-weight:600; }
  .product-head h2{ font-size:30px; margin:8px 0 6px; color:var(--bone); }
  .product-meta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .product-price{
    font-family:'JetBrains Mono', monospace;
    font-size:22px;
    font-weight:700;
    color:var(--ember-bright);
  }
  .product-rating{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:var(--smoke);
  }
  .product-rating .stars{ color:var(--ember-bright); letter-spacing:1px; }
  .product-cta{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .product-buy-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 24px;
    min-height:44px;
    border-radius:999px;
    border:1.5px solid var(--ember-bright);
    background:var(--ember-bright);
    color:var(--char);
    text-decoration:none;
    cursor:pointer;
    transition:opacity .12s ease;
  }
  .product-buy-btn:hover{ opacity:0.88; }
  .product-section{
    max-width:760px;
    margin:26px auto 0;
  }
  .product-section h3{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:15px;
    color:var(--ember-bright);
    margin:0 0 12px;
  }
  .product-feature-list{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:10px;
  }
  .product-feature-list li{
    display:flex;
    gap:10px;
    color:var(--smoke);
    font-size:15px;
    line-height:1.5;
  }
  .product-feature-list li::before{
    content:'';
    flex:0 0 auto;
    width:6px; height:6px;
    margin-top:8px;
    border-radius:50%;
    background:var(--ember-bright);
  }
  .review-body p{
    color:var(--smoke);
    font-size:15px;
    line-height:1.65;
    margin:0 0 14px;
  }
  .pros-cons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .pros-cons > div{

<script>
  function openLightbox(src, alt){
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightboxImg');
    img.src = src;
    img.alt = alt;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(e){
    if (e){
      e.stopPropagation();
      if (e.currentTarget.id === 'lightbox' && e.target.id !== 'lightbox') return;
    }
    const lb = document.getElementById('lightbox');
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

  const SWEEP_START = 210;  // deg, clockwise from top — matches CSS conic-gradient & transform:rotate()
  const SWEEP_DEG = 300;    // leaves a 60deg gap at the bottom of the dial

  function fracDeg(tempC){
    const f = (tempC - SCALE_MIN) / (SCALE_MAX - SCALE_MIN);
    return Math.max(0, Math.min(1, f)) * SWEEP_DEG;
  }
  function absoluteAngle(tempC){ return SWEEP_START + fracDeg(tempC); }
  function gradientPercent(tempC){ return (fracDeg(tempC) / 360) * 100; }

  // target internal temp (crimson) -> holding gap (dark) -> smoker

  function buildDialGradient(item){
    const p1 = gradientPercent(item.midC);
    const p2 = gradientPercent(item.targetC[0]);
    const p3 = gradientPercent(item.targetC[1]);
    const p4 = gradientPercent(item.smokerC[0]);
    const p5 = gradientPercent(item.smokerC[1]);
    const p6 = gradientPercent(SCALE_MAX);
    return `conic-gradient(from ${SWEEP_START}deg,
      var(--grey-zone) 0%, var(--grey-zone) ${p1}%,
      var(--amber) ${p1}%, var(--amber) ${p2}%,
      var(--ember-bright) ${p2}%, var(--ember-bright) ${p3}%,
      var(--dark-zone) ${p3}%, var(--dark-zone) ${p4}%,
      var(--kraft) ${p4}%, var(--kraft) ${p5}%,

                <span class="qs-label">Cook time</span>
                <span class="qs-val">${item.cookTimeNote}</span>
              </div>
              <div>
                <span class="qs-label">Rest</span>
                <span class="qs-val">${item.restNote}</span>
                ${item.holdC ? `<span class="qs-sub">Holding temp: ${primaryRange(item.holdC[0], item.holdC[1])} (${secondaryRange(item.holdC[0], item.holdC[1])})</span>` : ''}
              </div>
              <div>
                <span class="qs-label">Typical weight</span>
                <span class="qs-val">${item.weight}</span>
              </div>
            </div>
          </div>
        </div>

        ${item.rub ? `
        <div class="card rub-card">
          <h3>Dry Rub</h3>
          <p class="rub-note">${item.rubNote}</p>
          <ul class="rub-list">
            ${item.rub.map(r => `<li><span>${r.name}</span><span class="rub-amt">${r.amt ? r.amt : r.grams + ' g'}</span></li>`).join('')}
          </ul>
        </div>` : ''}

        <div class="details-grid">
          <div class="card method-card">
            <h3>Method</h3>
            <ol class="method-list">
              ${methodSteps.map(step => `<li>${step}</li>`).join('')}
            </ol>
          </div>
          <div class="side-stack">
            <div class="card">
              <h3>Wood</h3>
              <ul class="chips">${item.wood.map(w => `<li>${w}</li>`).join('')}</ul>
            </div>
            <div class="card">
              <h3>Pitmaster notes</h3>
              <ul class="tips-list">${item.tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>
          </div>
        </div>

        <div class="temp-strip">
          ${item.strip.map(s => {
            const parts = s.c.split('–').map(Number);
            const cLabel = parts.length === 2 ? primaryRange(parts[0], parts[1]) : primary(parts[0]);
            const fLabel = parts.length === 2 ? secondaryRange(parts[0], parts[1]) : secondary(parts[0]);
            return `<div class="temp-cell">
              <span class="tc-label">${s.label}</span>
              <span class="tc-c">${cLabel}</span>
              <span class="tc-f">${fLabel}</span>
            </div>`;
          }).join('')}
        </div>
      `;
      panels.appendChild(section);
    });
  }

  populateCategorySelect();
  populateItemSelect();
  renderAll();

  categorySelect.addEventListener('change', e => {
    currentCategory = e.target.value;
    currentTab = DATA.find(item => item.tabSub === currentCategory).id;
    populateItemSelect();
    showPanel(currentTab);
  });

  itemSelect.addEventListener('change', e => {
    currentTab = e.target.value;
    showPanel(currentTab);
  });

  // ---------- unit toggle ----------
  const unitBtns = document.querySelectorAll('.unit-btn');
  function syncUnitButtons(){
    unitBtns.forEach(b => b.classList.toggle('active', b.dataset.unit === unit));
  }
  syncUnitButtons();
  unitBtns.forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.unit === unit) return;
      unit = b.dataset.unit;
      localStorage.setItem(UNIT_KEY, unit);
      syncUnitButtons();
      renderAll();
      showPanel(currentTab);
    });
  });
</script>

<script>
  // ---------- install button ----------
  (function(){
    const installRow = document.getElementById('installRow');
    const installBtn  = document.getElementById('installBtn');
    const installTip  = document.getElementById('installTip');
    let deferredPrompt = null;

    const isStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    const isIOS = () =>
      /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function showInstallRow(){
      if (isStandalone()) return;
      installRow.classList.add('show');
    }
    function hideInstallRow(){
      installRow.classList.remove('show');
      installTip.classList.remove('show');
    }

    // Already installed / running as an app: never show the button.
    if (isStandalone()) {
      hideInstallRow();
    } else if (isIOS()) {
      // Safari on iOS has no beforeinstallprompt — offer manual instructions instead.
      showInstallRow();
    }

    // Chromium browsers (Chrome, Edge, Samsung Internet, etc.)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      if (isStandalone()) return;
      deferredPrompt = e;
      showInstallRow();
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      hideInstallRow();
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        const promptEvent = deferredPrompt;
        deferredPrompt = null;
        installTip.classList.remove('show');
        try {
          promptEvent.prompt();
          await promptEvent.userChoice;
        } catch (err) {
          console.warn('Install prompt failed:', err);
        }
        hideInstallRow();
        return;
      }
      // No native prompt available (iOS Safari) — toggle instructions.
      installTip.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
      if (!installRow.contains(e.target)) installTip.classList.remove('show');
    });

    // If the page becomes standalone later (e.g. launched from home screen
    // in a fresh tab after install), make sure the button stays hidden.
    window.matchMedia('(display-mode: standalone)').addEventListener?.('change', (e) => {
      if (e.matches) hideInstallRow();
    });
  })();
</script>
